<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light dark">
<title>Family Calendar</title>
<meta name="apple-mobile-web-app-title" content="Family">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<!-- No start_url in the manifest on purpose: the home-screen app starts at the
     address it was added from, so an install link (?key=…&install=1) carries the key. -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="css/app.css?v=__V__">
<link rel="stylesheet" href="css/theme-linen.css?v=__V__">
</head>
<body>
<div id="app">
  <!-- Side panel down the right edge (?rail=left for the left): views, Grocery, Refresh, Settings. Tap the app icon to expand. -->
  <nav id="rail" class="rail" aria-label="Sections"></nav>
  <!-- ☰ menu style instead (Settings › Display › Menu, this device only): fixed top-right corner -->
  <button class="menu-btn" data-menu-open aria-label="Menu">☰</button>
  <div id="banner" class="banner" role="status"></div>
  <div class="main">
    <div id="now-wrap" class="now-wrap"><section id="now" class="now" aria-label="Today"></section></div>
    <div class="week-wrap" id="week-wrap"><section id="week" class="week" aria-label="Coming days"></section></div>
    <section id="alt" class="alt" aria-live="polite"></section>
  </div>
  <div class="bottom">
    <div class="todos-wrap" id="todos-wrap"><div id="todos" class="todos" aria-label="Open to-dos"></div></div>
    <div class="side">
      <div id="chips" class="chips" role="group" aria-label="Show"></div>
      <span class="side-r"><span id="views" class="views" role="group" aria-label="View"></span>
      <button class="gro-btn" id="gro-btn" data-grocery-open aria-label="Groceries" hidden>🛒<b id="gro-count"></b></button>
      <button class="add-btn" data-add-open>＋ Add</button></span>
    </div>
  </div>
</div>
<!-- Phone layout (below 700 px, or ?mode=phone): agenda + to-dos behind a bottom tab bar -->
<div id="phone" class="phone">
  <header class="ph-top">
    <div class="ph-head">
      <span id="ph-date" class="ph-date"></span>
      <span class="ph-acts"><button id="ph-stamp" class="stamp" data-refresh title="Tap to refresh now"></button>
      <button class="gear-btn" data-settings-open aria-label="Settings">⚙</button></span>
    </div>
    <div id="ph-chips" class="chips ph-chips" role="group" aria-label="Show"></div>
  </header>
  <div id="ph-banner" class="banner ph-banner" role="status"></div>
  <main id="ph-main" class="ph-main"></main>
  <nav id="ph-tabs" class="ph-tabs" aria-label="Sections"></nav>
</div>
<div id="scrim" class="scrim" hidden></div>
<div id="night" class="night" hidden></div>
<div id="toast"></div>
<script type="module" src="js/app.js?v=__V__"></script>
<script>
  // Safety net: if the app has not started (e.g. a stale cached file broke a
  // module import), reload once from the network. sessionStorage stops loops.
  setTimeout(function () {
    if (window.__appStarted) return;
    try {
      if (sessionStorage.getItem('wall-rescue')) return;
      sessionStorage.setItem('wall-rescue', '1');
    } catch (e) { return; }
    var u = new URL(location.href);
    u.searchParams.set('r', Date.now());
    location.replace(u.toString());
  }, 10000);
</script>
</body>
</html>
