<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light dark">
<title>Family Calendar</title>
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="app">
  <div id="banner" class="banner" role="status"></div>
  <div class="main">
    <section id="now" class="now" aria-label="Today"></section>
    <section id="week" class="week" aria-label="Next 7 days"></section>
  </div>
  <div class="bottom">
    <div id="todos" class="todos" aria-label="Open to-dos"></div>
    <div class="side">
      <div id="chips" class="chips" role="group" aria-label="Show"></div>
      <span id="stamp" class="stamp"></span>
    </div>
  </div>
</div>
<div id="scrim" class="scrim" hidden></div>
<div id="night" class="night" hidden></div>
<script type="module" src="js/app.js"></script>
</body>
</html>
