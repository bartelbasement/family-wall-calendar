<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light dark">
<title>Family Calendar</title>
<meta name="apple-mobile-web-app-title" content="Family">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<!-- No start_url in the manifest on purpose: the home-screen app starts at the
     address it was added from, so an install link (?key=…&install=1) carries the key. -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="css/app.css?v=__V__">
</head>
<body>
<div id="app">
  <div id="banner" class="banner" role="status"></div>
  <div class="main">
    <section id="now" class="now" aria-label="Today"></section>
    <div class="week-wrap" id="week-wrap"><section id="week" class="week" aria-label="Coming days"></section></div>
  </div>
  <div class="bottom">
    <div class="todos-wrap" id="todos-wrap"><div id="todos" class="todos" aria-label="Open to-dos"></div></div>
    <div class="side">
      <div id="chips" class="chips" role="group" aria-label="Show"></div>
      <span class="side-r"><button class="add-btn" data-add-open>＋ Add</button>
      <button class="gear-btn" data-settings-open aria-label="Settings">⚙</button>
      <button id="stamp" class="stamp" data-refresh title="Tap to refresh now"></button></span>
    </div>
  </div>
</div>
<div id="scrim" class="scrim" hidden></div>
<div id="night" class="night" hidden></div>
<div id="toast"></div>
<script type="module" src="js/app.js?v=__V__"></script>
<script>
  // Safety net: if the app has not started (e.g. a stale cached file broke a
  // module import), reload once from the network. sessionStorage stops loops.
  setTimeout(function () {
    if (window.__appStarted) return;
    try {
      if (sessionStorage.getItem('wall-rescue')) return;
      sessionStorage.setItem('wall-rescue', '1');
    } catch (e) { return; }
    var u = new URL(location.href);
    u.searchParams.set('r', Date.now());
    location.replace(u.toString());
  }, 10000);
</script>
</body>
</html>
